name: Autorus Signal for Windows

on:
  push:
    branches: [download/autorus-signal-e4ec00d]
    paths: [.github/workflows/windows-package.yml, packaging/START-WINDOWS.txt]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build locked dependencies
        run: docker build -t signal-windows:local laravel
      - name: Assemble and verify the ZIP
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = e4ec00dca75514e8b6c4abdcd58d9bb160c2ae28
          git diff --exit-code HEAD^ HEAD -- laravel
          mkdir -p offline/Signal
          git archive HEAD^ laravel | tar -x -C offline/Signal
          cp packaging/START-WINDOWS.txt offline/Signal/
          container=$(docker create signal-windows:local)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app/vendor" offline/Signal/laravel/vendor
          docker run --rm --network none -v "$PWD/offline/Signal/laravel:/app:ro" --tmpfs /app/bootstrap/cache --tmpfs /app/storage/logs --tmpfs /app/storage/framework/views -w /app --entrypoint sh signal-windows:local -ec 'php artisan --version && php artisan view:cache && php artisan list --raw | grep "^signal:admin-create "'
          test ! -e offline/Signal/laravel/.env
          cd offline
          zip -qr Autorus-Signal-e4ec00d-Windows.zip Signal
          unzip -tq Autorus-Signal-e4ec00d-Windows.zip
      - name: Upload the checked ZIP to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload windows-e4ec00d offline/Autorus-Signal-e4ec00d-Windows.zip --repo "$GITHUB_REPOSITORY"
